[workspace]
resolver = "3"
members = ["crates/chess-core", "crates/tutor-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/gyorgybalazsi/chess-tutor"

[workspace.dependencies]
shakmaty = "0.30"
pgn-reader = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
